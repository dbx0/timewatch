name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle_glob: src-tauri/target/universal-apple-darwin/release/bundle
          - os: windows-latest
            args: ""
            rust_targets: ""
            bundle_glob: src-tauri/target/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - run: pnpm vitest run

      - name: cargo test
        run: cargo test
        working-directory: src-tauri

      # Tags are built and released by the next job; plain pushes/PRs just build.
      - name: tauri build
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: pnpm tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: timewatch-${{ matrix.os }}
          path: ${{ matrix.bundle_glob }}
          if-no-files-found: error

  # One draft release per tag, created once; the matrix jobs upload into it (no duplicate drafts).
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          id=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)
          if [ -z "$id" ]; then
            id=$(gh api "repos/${GITHUB_REPOSITORY}/releases" -X POST \
              -f tag_name="$TAG" \
              -f name="Timewatch $TAG" \
              -f body="Build sem assinatura da Apple/Microsoft (macOS: assinatura ad-hoc). Veja o README para instalar." \
              -F draft=true -F prerelease=false --jq .id)
          fi
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ad-hoc signature (also set in tauri.conf.json): without any signature, downloaded
          # Apple Silicon builds are reported as "damaged" instead of "unidentified developer".
          APPLE_SIGNING_IDENTITY: "-"
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
