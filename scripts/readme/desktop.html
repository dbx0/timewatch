<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timewatch demo desktop</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0c0d11;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        cursor: none;
      }
      #wallpaper {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(1100px 700px at 12% 108%, rgba(79, 134, 255, 0.55), transparent 60%),
          radial-gradient(900px 620px at 92% 96%, rgba(126, 87, 214, 0.45), transparent 62%),
          radial-gradient(800px 520px at 70% 8%, rgba(41, 92, 160, 0.42), transparent 60%),
          radial-gradient(700px 500px at 18% 12%, rgba(60, 46, 110, 0.5), transparent 60%),
          linear-gradient(160deg, #141a2c 0%, #10131f 45%, #171329 100%);
      }
      #wallpaper::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(520px 260px at 50% 78%, rgba(168, 196, 255, 0.1), transparent 70%);
      }
      #menubar {
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 14px 0 16px;
        box-sizing: border-box;
        background: rgba(10, 12, 20, 0.42);
        backdrop-filter: blur(18px);
        color: rgba(255, 255, 255, 0.88);
        font-size: 13px;
        z-index: 1;
      }
      #menubar .left,
      #menubar .right {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      #menubar .glyph {
        width: 13px;
        height: 13px;
        border-radius: 50%;
        border: 1.6px solid rgba(255, 255, 255, 0.85);
        box-sizing: border-box;
      }
      #menubar .menu {
        color: rgba(255, 255, 255, 0.78);
      }
      #menubar .menu b {
        font-weight: 600;
        color: #fff;
      }
      #tray {
        display: flex;
        align-items: center;
        gap: 5px;
        font-variant-numeric: tabular-nums;
      }
      #tray img {
        width: 16px;
        height: 16px;
      }
      .notch {
        position: fixed;
        top: 0;
        left: 50%;
        width: 185px;
        height: 32px;
        margin-left: -92.5px;
        background: #000;
        border-radius: 0 0 12px 12px;
        z-index: 2;
      }
      iframe.win {
        position: fixed;
        border: 0;
        border-radius: 12px;
        background: transparent;
        box-shadow:
          0 28px 70px rgba(0, 0, 0, 0.55),
          0 0 0 0.5px rgba(0, 0, 0, 0.6);
        z-index: 5;
        transition:
          opacity 0.22s ease,
          transform 0.26s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      iframe.win.hidden {
        opacity: 0;
        transform: scale(0.96) translateY(8px);
        pointer-events: none;
      }
      #notch-frame {
        position: fixed;
        top: 0;
        left: 50%;
        margin-left: -260px;
        width: 520px;
        height: 640px;
        border: 0;
        background: transparent;
        pointer-events: none;
        z-index: 50;
      }
      #cursor {
        position: fixed;
        left: 0;
        top: 0;
        width: 24px;
        height: 24px;
        z-index: 1000;
        pointer-events: none;
        transform: translate(-100px, -100px);
        filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.45));
      }
      #cursor .press {
        position: absolute;
        left: -14px;
        top: -14px;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: rgba(168, 196, 255, 0.45);
        transform: scale(0.2);
        opacity: 0;
      }
      #cursor.down .press {
        animation: press 0.45s ease-out;
      }
      @keyframes press {
        0% {
          transform: scale(0.2);
          opacity: 0.9;
        }
        100% {
          transform: scale(1.5);
          opacity: 0;
        }
      }
      #keycap {
        position: fixed;
        left: 940px;
        top: 190px;
        transform: translate(-50%, 12px);
        opacity: 0;
        display: flex;
        gap: 6px;
        z-index: 900;
        transition:
          opacity 0.2s ease,
          transform 0.2s ease;
      }
      #keycap.on {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      #keycap kbd {
        font: 600 15px/1 -apple-system, BlinkMacSystemFont, sans-serif;
        color: #fff;
        background: rgba(20, 22, 30, 0.86);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-bottom-width: 3px;
        border-radius: 9px;
        padding: 9px 13px;
        min-width: 16px;
        text-align: center;
        backdrop-filter: blur(10px);
      }
    </style>
  </head>
  <body>
    <div id="wallpaper"></div>
    <div id="menubar">
      <div class="left">
        <span class="glyph"></span>
        <span class="menu"><b>Desktop</b></span>
        <span class="menu">File</span>
        <span class="menu">Edit</span>
        <span class="menu">View</span>
        <span class="menu">Window</span>
        <span class="menu">Help</span>
      </div>
      <div class="right">
        <span id="tray"><img id="tray-icon" alt="" /><span id="tray-time"></span></span>
        <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="rgba(255,255,255,.88)" stroke-width="1.5" stroke-linecap="round">
          <path d="M1.5 4.2a10 10 0 0 1 14 0M4 6.9a6.4 6.4 0 0 1 9 0M6.6 9.5a2.6 2.6 0 0 1 3.8 0" />
        </svg>
        <svg width="26" height="12" viewBox="0 0 26 12" fill="none">
          <rect x="0.75" y="0.75" width="21.5" height="10.5" rx="3" stroke="rgba(255,255,255,.6)" stroke-width="1.2" />
          <rect x="2.5" y="2.5" width="15" height="7" rx="1.6" fill="rgba(255,255,255,.9)" />
          <rect x="23.4" y="4" width="1.8" height="4" rx=".9" fill="rgba(255,255,255,.6)" />
        </svg>
        <span id="clock"></span>
      </div>
    </div>
    <div class="notch"></div>
    <div id="windows"></div>
    <iframe id="notch-frame" title="notch" allowtransparency="true"></iframe>
    <div id="keycap"></div>
    <div id="cursor">
      <div class="press"></div>
      <svg width="24" height="24" viewBox="0 0 24 24">
        <path d="M5 2.5v17.2l4.3-4.1 2.9 6.6 2.9-1.3-2.8-6.4h6.1z" fill="#fff" stroke="#111" stroke-width="1.2" stroke-linejoin="round" />
      </svg>
    </div>
    <script type="module" src="./desktop.ts"></script>
  </body>
</html>
