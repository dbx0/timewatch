<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Timewatch cover</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 640px;
        overflow: hidden;
        background: #0c0d11;
        color: #ececf1;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        background:
          radial-gradient(700px 420px at 78% 40%, rgba(79, 134, 255, 0.22), transparent 70%),
          radial-gradient(520px 360px at 8% 100%, rgba(126, 87, 214, 0.18), transparent 70%),
          #0c0d11;
      }
      .brand {
        position: absolute;
        left: 88px;
        top: 0;
        bottom: 0;
        width: 470px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .brand img {
        width: 116px;
        height: 116px;
        margin: 0 0 26px -8px;
        filter: drop-shadow(0 14px 30px rgba(0, 0, 0, 0.55));
      }
      .brand h1 {
        margin: 0;
        font-size: 66px;
        font-weight: 700;
        letter-spacing: -2px;
        line-height: 1;
      }
      .brand p {
        margin: 18px 0 0;
        font-size: 24px;
        line-height: 1.35;
        color: #a9a9b6;
        letter-spacing: -0.2px;
      }
      .brand p b {
        color: #a8c4ff;
        font-weight: 600;
      }
      .tags {
        display: flex;
        gap: 8px;
        margin-top: 30px;
      }
      .tags span {
        font-size: 14px;
        color: #c9d6f5;
        background: rgba(79, 134, 255, 0.14);
        border: 1px solid rgba(79, 134, 255, 0.28);
        padding: 6px 12px;
        border-radius: 999px;
      }
      .screen {
        position: absolute;
        left: 620px;
        top: 70px;
        width: 600px;
        height: 640px;
        border-radius: 18px 18px 0 0;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background:
          radial-gradient(520px 420px at 20% 100%, rgba(79, 134, 255, 0.5), transparent 65%),
          radial-gradient(460px 380px at 95% 85%, rgba(126, 87, 214, 0.45), transparent 65%),
          linear-gradient(160deg, #141a2c 0%, #10131f 45%, #171329 100%);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
      }
      #menubar {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 14px;
        background: rgba(10, 12, 20, 0.42);
        font-size: 13px;
        color: rgba(255, 255, 255, 0.85);
      }
      #menubar .right {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      #tray {
        display: flex;
        gap: 5px;
        align-items: center;
        font-variant-numeric: tabular-nums;
      }
      #tray img {
        width: 16px;
        height: 16px;
      }
      .notch {
        position: absolute;
        top: 0;
        left: 50%;
        width: 185px;
        height: 32px;
        margin-left: -92.5px;
        background: #000;
        border-radius: 0 0 12px 12px;
      }
      #notch-frame {
        position: absolute;
        top: 0;
        left: 50%;
        margin-left: -260px;
        width: 520px;
        height: 640px;
        border: 0;
        background: transparent;
        pointer-events: none;
      }
      #cursor,
      #keycap,
      #windows {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <img id="app-icon" alt="" />
      <h1>Timewatch</h1>
      <p>A clock in your notch.<br /><b>Your timesheet, ready by Friday.</b></p>
      <div class="tags"><span>macOS · Windows · Linux</span><span>100% local</span><span>Open source</span></div>
    </div>
    <div class="screen">
      <div id="menubar">
        <span></span>
        <div class="right">
          <span id="tray"><img id="tray-icon" alt="" /><span id="tray-time"></span></span>
          <span id="clock"></span>
        </div>
      </div>
      <div class="notch"></div>
      <iframe id="notch-frame" title="notch" allowtransparency="true"></iframe>
    </div>
    <div id="windows"></div>
    <div id="keycap"></div>
    <div id="cursor"></div>
    <script type="module">
      import icon from "../../src-tauri/icons/icon.png";
      document.getElementById("app-icon").src = icon;
    </script>
    <script type="module" src="./desktop.ts"></script>
  </body>
</html>
