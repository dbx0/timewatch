[package]
name = "timewatch"
version = "0.1.0"
description = "Timewatch"
authors = ["timewatch"]
edition = "2021"

[lib]
name = "timewatch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-autostart = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.42", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tauri-plugin-dialog = "2.8"
tauri-plugin-clipboard-manager = "2.5"
sys-locale = "0.3.2"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSScreen", "NSResponder", "NSWorkspace"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSGeometry", "NSString", "NSNotification", "NSDistributedNotificationCenter", "NSOperation", "block2"] }
block2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_System_WindowsProgramming", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[dev-dependencies]
chrono-tz = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Proc-macro dylibs must not be stripped: recent macOS rejects them at dlopen
# ("mis-aligned LINKEDIT string pool") and the release build fails.
[profile.release.build-override]
strip = "none"
