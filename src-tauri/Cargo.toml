[package]
name = "timewatch"
version = "0.1.0"
description = "Timewatch"
authors = ["timewatch"]
edition = "2021"

[lib]
name = "timewatch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.42", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSScreen", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSGeometry", "NSString"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[dev-dependencies]
chrono-tz = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
